<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}My Dark Sky{% endblock %}</title>
  <meta name="description" content="Beautiful Flask weather app with location search, current location support, date navigation, and five-minute caching." />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
    crossorigin="anonymous"
  />
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body>
  {% block body %}{% endblock %}
  <script>
    const dateInput = document.getElementById("date-input");
    const form = document.getElementById("weather-form");
    const searchInput = document.getElementById("location-query");
    const pinnedFields = document.querySelectorAll("[data-pinned-location]");

    if (searchInput && pinnedFields.length) {
      const syncPinnedFields = () => {
        const disablePinned = searchInput.value.trim().length > 0;
        pinnedFields.forEach((field) => {
          field.disabled = disablePinned;
        });
      };
      syncPinnedFields();
      searchInput.addEventListener("input", syncPinnedFields);
    }

    if (dateInput && form) {
      dateInput.addEventListener("change", () => form.submit());
    }

    const useLocationButton = document.getElementById("use-location");
    if (useLocationButton) {
      useLocationButton.addEventListener("click", () => {
        if (!navigator.geolocation) {
          alert("Geolocation is not available in this browser.");
          return;
        }

        useLocationButton.disabled = true;
        useLocationButton.textContent = "Locating...";
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const params = new URLSearchParams(window.location.search);
            params.set("lat", position.coords.latitude.toFixed(4));
            params.set("lon", position.coords.longitude.toFixed(4));
            params.set("name", "My current location");
            if (!params.get("date")) {
              params.set("date", "{{ today }}");
            }
            window.location.search = params.toString();
          },
          () => {
            alert("Unable to access your location.");
            useLocationButton.disabled = false;
            useLocationButton.textContent = "Use current location";
          }
        );
      });
    }
  </script>
</body>
</html>
